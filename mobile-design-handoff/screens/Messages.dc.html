<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tin nhắn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#1A47D6}
button,input{font-family:inherit}
input::placeholder{color:#5A6A8C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 52px 20px 100px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 700">Tin nhắn</h1>
      <button type="button" aria-label="Tin nhắn mới" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid #DCE6FA; background: #FFFFFF; color: #0F2D6B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </header>

    <label style="height: 48px; border-radius: 9999px; background: #FFFFFF; border: 1px solid #DCE6FA; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6A8C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm cuộc trò chuyện</span>
      <input type="search" placeholder="Tìm cuộc trò chuyện" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; color: #0F2D6B">
    </label>

    <a href="KokoChat.dc.html" style="border-radius: 24px; background: #EBF3FF; padding: 14px 16px; display: flex; align-items: center; gap: 12px; color: #0F2D6B">
      <span style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 9999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="/_blob/06de8bb72ea17ab76437267c6498c7ed" alt="" style="width: 46px; height: 46px; object-fit: contain"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px">Koko <span style="padding: 2px 8px; border-radius: 9999px; background: #2F6BFF; color: #FFFFFF; font-size: 10px; font-weight: 700; letter-spacing: 0.06em">TRỢ LÝ AI</span></span>
        <span style="font-size: 13px; color: #3D4F75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Hỏi mình về mentor, đặt lịch, S-coins…</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #5A6A8C; margin-top: 4px">GẦN ĐÂY</div>

    <div style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; box-shadow: 0 8px 32px rgba(15,45,107,0.06); overflow: hidden; display: flex; flex-direction: column">
      <sc-for list="{{convos}}" as="c" hint-placeholder-count="5">
        <a href="ChatDetail.dc.html" style="{{c.row}}">
          <span style="position: relative; flex-shrink: 0; width: 48px; height: 48px; border-radius: 9999px; background: #EBF3FF; color: #2F6BFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.ini}}<sc-if value="{{c.online}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 9999px; background: #22C55E; border: 2px solid #FFFFFF"></span></sc-if></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 700; color: #0F2D6B">{{c.name}}</span><span style="font-size: 12px; color: #5A6A8C">{{c.time}}</span></span>
            <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="{{c.msgStyle}}">{{c.msg}}</span><sc-if value="{{c.unread}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #2F6BFF; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.unread}}</span></sc-if></span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Điều hướng chính" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #DCE6FA; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="Main.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg><span>Bảng tin</span></a>
    <a href="Mentors.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Mentor</span></a>
    <a href="MyBookings.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Lịch hẹn</span></a>
    <a href="Messages.dc.html" aria-current="page" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #2F6BFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Tin nhắn</span></a>
    <a href="Profile.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Hồ sơ</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { ini: 'SC', name: 'Sarah Chen', msg: 'Chị xem CV của em rồi, mình trao đổi thêm ở buổi T3 nhé!', time: '21:04', unread: 2, online: true },
      { ini: 'DN', name: 'David Nguyen', msg: 'Hẹn em 20:30 tối nay, nhớ chuẩn bị đề bài nha', time: '18:10', unread: 0, online: true },
      { ini: 'LT', name: 'Linh Tran', msg: 'Cảm ơn em đã để lại đánh giá!', time: 'T2', unread: 0, online: false },
      { ini: 'AK', name: 'Alex Kim', msg: 'Em: Dạ em gửi anh link notebook ạ', time: '21/09', unread: 0, online: false },
      { ini: 'MP', name: 'Mai Phuong', msg: 'Chị gửi em tài liệu growth framework', time: '18/09', unread: 0, online: false }
    ];
    const convos = raw.map((c, i) => ({
      ...c,
      unread: c.unread > 0 ? String(c.unread) : '',
      row: 'display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 76px; box-sizing: border-box;' + (i > 0 ? ' border-top: 1px solid #DCE6FA;' : ''),
      msgStyle: 'font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (c.unread > 0 ? 'color: #0F2D6B; font-weight: 600;' : 'color: #5A6A8C; font-weight: 400;')
    }));
    return { convos };
  }
}
</script>
</body>
</html>
