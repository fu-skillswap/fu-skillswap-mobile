<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mentor · Lịch đặt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#1A47D6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 52px 20px 100px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 700">Lịch đặt</h1>
      <button type="button" aria-label="Sắp xếp: gần nhất trước" style="height: 44px; padding: 0 14px; border-radius: 9999px; border: 1px solid #DCE6FA; background: #FFFFFF; color: #3D4F75; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/></svg>Gần nhất</button>
    </header>

    <div role="tablist" aria-label="Lọc lịch đặt" style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{list}}" as="b" hint-placeholder-count="3">
      <article style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; box-shadow: 0 8px 32px rgba(15,45,107,0.06); padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <a href="MentorBookingDetail.dc.html" style="display: flex; align-items: center; gap: 12px; color: #0F2D6B">
          <span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 9999px; background: #EBF3FF; color: #2F6BFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{b.ini}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{b.mentee}}</span><span style="font-size: 13px; color: #3D4F75">{{b.service}}</span></span>
          <span style="{{b.badge}}">{{b.status}}</span>
        </a>
        <div style="display: flex; gap: 16px; padding: 10px 12px; border-radius: 16px; background: #F4F7FD; font-size: 13px; font-weight: 600">
          <span style="display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>{{b.date}}</span>
          <span style="display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{b.time}}</span>
          <span style="margin-left: auto; font-weight: 700">{{b.price}}</span>
        </div>
        <sc-if value="{{b.waiting}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 8px">
            <button type="button" style="flex-grow: 1; height: 44px; border-radius: 9999px; border: 1px solid #DCE6FA; background: #FFFFFF; color: #3D4F75; font-size: 14px; font-weight: 600; cursor: pointer">Từ chối</button>
            <a href="MentorBookingDetail.dc.html" style="flex-grow: 1; height: 44px; border-radius: 9999px; background: linear-gradient(135deg, #1A47D6 0%, #2F6BFF 100%); box-shadow: 0 8px 20px rgba(47,107,255,0.30); color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">Xác nhận</a>
          </div>
        </sc-if>
        <sc-if value="{{b.live}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 8px">
            <a href="#" style="flex-grow: 1; height: 44px; border-radius: 9999px; background: linear-gradient(135deg, #1A47D6 0%, #2F6BFF 100%); box-shadow: 0 8px 20px rgba(47,107,255,0.30); color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Check-in</a>
            <a href="#" style="flex-grow: 1; height: 44px; border-radius: 9999px; background: #EBF3FF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">Mở Google Meet</a>
          </div>
        </sc-if>
      </article>
    </sc-for>
  </div>

  <nav aria-label="Điều hướng mentor" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #DCE6FA; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="MentorDashboard.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Tổng quan</span></a>
    <a href="MentorBookings.dc.html" aria-current="page" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #2F6BFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/></svg><span>Booking</span></a>
    <a href="MentorSchedule.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Lịch dạy</span></a>
    <a href="MentorWallet.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span>Ví</span></a>
    <a href="MentorMore.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Thêm</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'ALL' }; }
  renderVals() {
    const all = [
      { ini: 'QH', mentee: 'Quang Huy', service: 'Mock interview PM', date: 'Hôm nay', time: '20:30', price: '250.000', kind: 'IN_PROGRESS' },
      { ini: 'TH', mentee: 'Thu Hà', service: 'Review CV 1:1', date: 'T3, 06/10', time: '19:00', price: '150.000', kind: 'WAITING' },
      { ini: 'NA', mentee: 'Ngọc Anh', service: 'Review CV 1:1', date: 'T4, 07/10', time: '08:00', price: '150.000', kind: 'WAITING' },
      { ini: 'MĐ', mentee: 'Minh Đức', service: 'Review CV 1:1', date: 'T6, 26/09', time: '19:00', price: '150.000', kind: 'COMPLETED' }
    ];
    const meta = {
      IN_PROGRESS: ['Đang diễn ra', 'background: #2F6BFF; color: #FFFFFF;'],
      WAITING: ['Đang chờ', 'background: #FEF3C7; color: #B45309;'],
      COMPLETED: ['Hoàn thành', 'background: #DCFCE7; color: #15803D;']
    };
    const defs = [['ALL', 'Tất cả'], ['WAITING', 'Đang chờ'], ['IN_PROGRESS', 'Đang diễn ra'], ['COMPLETED', 'Đã hoàn thành'], ['CANCELLED', 'Đã hủy']];
    const cur = this.state.tab;
    const tabs = defs.map(([v, l]) => {
      const n = v === 'ALL' ? all.length : all.filter((b) => b.kind === v).length;
      const on = v === cur;
      return {
        label: l + ' (' + n + ')', on: on ? 'true' : 'false',
        style: 'flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 9999px; font-size: 13px; cursor: pointer; ' + (on ? 'border: 1px solid #2F6BFF; background: #2F6BFF; color: #FFFFFF; font-weight: 700;' : 'border: 1px solid #DCE6FA; background: #FFFFFF; color: #3D4F75; font-weight: 600;'),
        pick: () => this.setState({ tab: v })
      };
    });
    const list = all.filter((b) => cur === 'ALL' || b.kind === cur).map((b) => ({
      ...b, status: meta[b.kind][0],
      badge: 'flex-shrink: 0; padding: 5px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; ' + meta[b.kind][1],
      waiting: b.kind === 'WAITING', live: b.kind === 'IN_PROGRESS'
    }));
    return { tabs, list };
  }
}
</script>
</body>
</html>
