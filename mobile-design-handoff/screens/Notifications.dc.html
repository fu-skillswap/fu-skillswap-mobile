<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thông báo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#1A47D6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 40px">
    <header style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 9999px; background: #FFFFFF; border: 1px solid #DCE6FA; color: #0F2D6B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <h1 style="margin: 0; flex-grow: 1; font-size: 22px; font-weight: 700">Thông báo</h1>
      <button type="button" onClick="{{readAll}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #2F6BFF; font-size: 13px; font-weight: 600; cursor: pointer">Đọc tất cả</button>
    </header>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #5A6A8C; margin: 6px 4px 0">{{g.title}}</span>
        <div style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; overflow: hidden; display: flex; flex-direction: column">
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a href="{{n.href}}" style="{{n.row}}">
              <span style="{{n.iconBox}}">
                <sc-if value="{{n.isBooking}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></sc-if>
                <sc-if value="{{n.isLike}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></sc-if>
                <sc-if value="{{n.isCoin}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></sc-if>
                <sc-if value="{{n.isChat}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></sc-if>
                <sc-if value="{{n.isClock}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></sc-if>
              </span>
              <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="{{n.textStyle}}">{{n.text}}</span>
                <span style="font-size: 12px; color: #5A6A8C">{{n.time}}</span>
              </div>
              <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; width: 10px; height: 10px; border-radius: 9999px; background: #2F6BFF; margin-top: 6px" aria-label="Chưa đọc"></span></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { allRead: false }; }
  renderVals() {
    const raw = [
      { g: 'HÔM NAY', kind: 'Clock', text: 'Buổi Mock interview với David Nguyen bắt đầu sau 30 phút', time: '20:00', unread: true, href: 'MyBookings.dc.html', tone: 'warn' },
      { g: 'HÔM NAY', kind: 'Booking', text: 'Sarah Chen đã xác nhận lịch Review CV 1:1 vào T3, 06/10 lúc 19:00', time: '19:12', unread: true, href: 'MyBookings.dc.html', tone: 'ok' },
      { g: 'HÔM NAY', kind: 'Chat', text: 'Sarah Chen đã gửi cho bạn 2 tin nhắn mới', time: '21:04', unread: true, href: 'ChatDetail.dc.html', tone: 'blue' },
      { g: 'HÔM NAY', kind: 'Like', text: 'Minh Đức và 12 người khác thích bài viết của bạn', time: '15:40', unread: false, href: 'PostDetail.dc.html', tone: 'blue' },
      { g: 'TRƯỚC ĐÓ', kind: 'Coin', text: 'Đã trừ 150.000 S-coins cho lịch Review CV 1:1', time: 'Hôm qua', unread: false, href: 'Profile.dc.html', tone: 'blue' },
      { g: 'TRƯỚC ĐÓ', kind: 'Booking', text: 'Buổi học với Linh Tran đã hoàn thành. Hãy để lại đánh giá nhé!', time: '28/09', unread: false, href: 'MyBookings.dc.html', tone: 'ok' }
    ];
    const tones = { ok: 'background: #DCFCE7; color: #15803D;', warn: 'background: #FEF3C7; color: #B45309;', blue: 'background: #EBF3FF; color: #2F6BFF;' };
    const groups = [];
    raw.forEach((n) => {
      let grp = groups.find((x) => x.title === n.g);
      if (!grp) { grp = { title: n.g, items: [] }; groups.push(grp); }
      const unread = n.unread && !this.state.allRead;
      grp.items.push({
        ...n, unread,
        isBooking: n.kind === 'Booking', isLike: n.kind === 'Like', isCoin: n.kind === 'Coin', isChat: n.kind === 'Chat', isClock: n.kind === 'Clock',
        row: 'display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; color: #0F2D6B;' + (grp.items.length ? ' border-top: 1px solid #DCE6FA;' : '') + (unread ? ' background: #F7FAFF;' : ''),
        iconBox: 'flex-shrink: 0; width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; ' + tones[n.tone],
        textStyle: 'font-size: 14px; line-height: 20px; ' + (unread ? 'font-weight: 600; color: #0F2D6B;' : 'font-weight: 400; color: #3D4F75;')
      });
    });
    return { groups, readAll: () => this.setState({ allRead: true }) };
  }
}
</script>
</body>
</html>
