<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mentor · Chi tiết dịch vụ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#1A47D6}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 120px">
    <header style="display: flex; align-items: center; gap: 12px">
      <a href="MentorServices.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 9999px; background: #FFFFFF; border: 1px solid #DCE6FA; color: #0F2D6B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #2F6BFF">DỊCH VỤ TƯ VẤN 1:1</span>
        <h1 style="margin: 0; font-size: 18px; font-weight: 700">Chỉnh sửa dịch vụ</h1>
      </div>
    </header>

    <section style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Thông tin dịch vụ</h2>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Tên dịch vụ
        <input type="text" value="Review CV 1:1" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #DCE6FA; font-size: 15px; font-weight: 500; color: #0F2D6B">
      </label>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: #F4F7FD">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">45 phút · Thời lượng cố định</span><span style="font-size: 11px; color: #5A6A8C">Thời lượng không thể đổi theo chính sách dịch vụ</span></span>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Mô tả dịch vụ
        <textarea rows="3" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #DCE6FA; font-size: 14px; line-height: 21px; color: #0F2D6B; resize: none">Đọc và góp ý trực tiếp CV của bạn cho vị trí Product Manager: cấu trúc, cách viết dự án và số liệu tác động.</textarea>
      </label>
    </section>

    <section style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Thông tin giá</h2>
      <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #2F6BFF; font-size: 13px; font-weight: 600">Giá công khai
        <input type="text" value="150.000" style="flex-grow: 1; min-width: 0; border: 0; outline: none; text-align: right; font-size: 16px; font-weight: 800; color: #0F2D6B">
        <span style="font-size: 12px; color: #5A6A8C">S-coins</span>
      </label>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #3D4F75"><span>Phí nền tảng</span><span style="font-weight: 600; color: #0F2D6B">[PHÍ]</span></div>
      <div style="display: flex; justify-content: space-between; border-top: 1px dashed #DCE6FA; padding-top: 10px; font-size: 14px; font-weight: 700"><span>Thu nhập dự kiến</span><span style="color: #15803D">[THU NHẬP] S-coins</span></div>
    </section>

    <section style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #EBF3FF; color: #2F6BFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Duy trì chat sau buổi học</span><span style="font-size: 12px; color: #5A6A8C">Cho phép tiếp tục trao đổi sau phiên</span></span>
      <button type="button" role="switch" aria-checked="{{chatAria}}" aria-label="Duy trì chat sau buổi học" onClick="{{toggleChat}}" style="{{track}}"><span style="{{knob}}"></span></button>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 20px 30px; background: #FFFFFF; border-top: 1px solid #DCE6FA">
    <a href="MentorServices.dc.html" style="height: 56px; border-radius: 9999px; background: linear-gradient(135deg, #1A47D6 0%, #2F6BFF 100%); box-shadow: 0 8px 20px rgba(47,107,255,0.30); color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Lưu thay đổi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { chat: true }; }
  renderVals() {
    const on = this.state.chat;
    return {
      chatAria: on ? 'true' : 'false',
      track: 'flex-shrink: 0; position: relative; width: 52px; height: 30px; padding: 0; border: 0; border-radius: 9999px; cursor: pointer; background: ' + (on ? '#2F6BFF' : '#C9D6EE') + ';',
      knob: 'position: absolute; top: 3px; ' + (on ? 'right: 3px;' : 'left: 3px;') + ' width: 24px; height: 24px; border-radius: 9999px; background: #FFFFFF;',
      toggleChat: () => this.setState({ chat: !on })
    };
  }
}
</script>
</body>
</html>
