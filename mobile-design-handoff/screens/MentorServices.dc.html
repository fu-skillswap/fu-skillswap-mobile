<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mentor · Dịch vụ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#1A47D6}
button,input{font-family:inherit}
input::placeholder{color:#5A6A8C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 100px">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700">Dịch vụ &amp; Lịch dạy</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 9999px; background: #EBF3FF">
      <a href="MentorSchedule.dc.html" style="height: 40px; border-radius: 9999px; color: #3D4F75; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">Lịch dạy</a>
      <a href="MentorServices.dc.html" aria-current="page" style="height: 40px; border-radius: 9999px; background: #FFFFFF; color: #2F6BFF; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(15,45,107,0.08); display: flex; align-items: center; justify-content: center">Dịch vụ</a>
    </div>

    <label style="height: 48px; border-radius: 9999px; background: #FFFFFF; border: 1px solid #DCE6FA; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6A8C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm kiếm dịch vụ</span>
      <input type="search" placeholder="Tìm kiếm dịch vụ…" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; color: #0F2D6B">
    </label>

    <sc-for list="{{services}}" as="s" hint-placeholder-count="3">
      <div style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; box-shadow: 0 8px 32px rgba(15,45,107,0.06); padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <a href="MentorServiceDetail.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; color: #0F2D6B">
            <span style="font-size: 15px; font-weight: 700">{{s.name}}</span>
            <span style="font-size: 12px; color: #5A6A8C">{{s.meta}}</span>
          </a>
          <button type="button" role="switch" aria-checked="{{s.onAria}}" aria-label="{{s.toggleLabel}}" onClick="{{s.toggle}}" style="{{s.track}}"><span style="{{s.knob}}"></span></button>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #DCE6FA; padding-top: 12px">
          <span style="font-size: 16px; font-weight: 800">{{s.price}}</span>
          <span style="{{s.badge}}">{{s.status}}</span>
        </div>
      </div>
    </sc-for>

    <button type="button" style="height: 52px; border-radius: 20px; border: 1.5px dashed #2F6BFF; background: transparent; color: #2F6BFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tạo dịch vụ mới</button>
  </div>

  <nav aria-label="Điều hướng mentor" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #DCE6FA; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="MentorDashboard.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Tổng quan</span></a>
    <a href="MentorBookings.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/></svg><span>Booking</span></a>
    <a href="MentorSchedule.dc.html" aria-current="page" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #2F6BFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Lịch dạy</span></a>
    <a href="MentorWallet.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span>Ví</span></a>
    <a href="MentorMore.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Thêm</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: { 2: true } }; }
  renderVals() {
    const raw = [
      { name: 'Review CV 1:1', meta: '45 phút · Online · 32 lượt đặt', price: '150.000 S-coins' },
      { name: 'Mock interview PM', meta: '60 phút · Online · 18 lượt đặt', price: '250.000 S-coins' },
      { name: 'Định hướng nghề Product', meta: '30 phút · Online · 9 lượt đặt', price: 'Miễn phí' }
    ];
    const services = raw.map((s, i) => {
      const on = !this.state.off[i];
      return {
        ...s, onAria: on ? 'true' : 'false', toggleLabel: 'Mở nhận đặt: ' + s.name,
        status: on ? 'Đang mở' : 'Đã đóng',
        badge: 'padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; ' + (on ? 'background: #DCFCE7; color: #15803D;' : 'background: #EEF2FA; color: #5A6A8C;'),
        track: 'flex-shrink: 0; position: relative; width: 52px; height: 30px; margin: 7px 0; padding: 0; border: 0; border-radius: 9999px; cursor: pointer; background: ' + (on ? '#2F6BFF' : '#C9D6EE') + ';',
        knob: 'position: absolute; top: 3px; ' + (on ? 'right: 3px;' : 'left: 3px;') + ' width: 24px; height: 24px; border-radius: 9999px; background: #FFFFFF;',
        toggle: () => this.setState({ off: { ...this.state.off, [i]: on } })
      };
    });
    return { services };
  }
}
</script>
</body>
</html>
