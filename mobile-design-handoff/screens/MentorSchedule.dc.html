<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mentor · Lịch dạy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6BFF;text-decoration:none}a:hover{color:#1A47D6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 100px">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700">Dịch vụ &amp; Lịch dạy</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 9999px; background: #EBF3FF">
      <a href="MentorSchedule.dc.html" aria-current="page" style="height: 40px; border-radius: 9999px; background: #FFFFFF; color: #2F6BFF; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(15,45,107,0.08); display: flex; align-items: center; justify-content: center">Lịch dạy</a>
      <a href="MentorServices.dc.html" style="height: 40px; border-radius: 9999px; color: #3D4F75; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">Dịch vụ</a>
    </div>

    <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE6FA; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #DCFCE7; color: #15803D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M3 21v-5h5M21 3v5h-5"/></svg></span>
      <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Google Calendar</span><span style="font-size: 12px; color: #15803D">Đang đồng bộ lịch rảnh tự động</span></div>
      <a href="#" style="font-size: 13px; font-weight: 600; padding: 12px 4px">Quản lý</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="{{d.style}}">
          <span style="font-size: 11px; font-weight: 600; opacity: 0.85">{{d.dow}}</span>
          <span style="font-size: 16px; font-weight: 700">{{d.num}}</span>
          <span style="{{d.dot}}"></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{dayTitle}}</h2>
      <span style="font-size: 12px; color: #5A6A8C">GMT+7</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 12px; align-items: stretch">
          <span style="flex-shrink: 0; width: 46px; padding-top: 12px; font-size: 13px; font-weight: 700; color: #3D4F75">{{s.start}}</span>
          <div style="{{s.box}}">
            <span style="font-size: 14px; font-weight: 700">{{s.title}}</span>
            <span style="font-size: 12px; opacity: 0.9">{{s.sub}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <a href="#" aria-label="Thêm khung giờ rảnh" style="position: absolute; right: 20px; bottom: 104px; height: 52px; padding: 0 20px; border-radius: 9999px; background: linear-gradient(135deg, #1A47D6 0%, #2F6BFF 100%); box-shadow: 0 8px 20px rgba(47,107,255,0.30); color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Thêm giờ rảnh</a>

  <nav aria-label="Điều hướng mentor" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #DCE6FA; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="MentorDashboard.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Tổng quan</span></a>
    <a href="MentorBookings.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/></svg><span>Booking</span></a>
    <a href="MentorSchedule.dc.html" aria-current="page" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #2F6BFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Lịch dạy</span></a>
    <a href="MentorWallet.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span>Ví</span></a>
    <a href="MentorMore.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Thêm</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 1 }; }
  renderVals() {
    const dows = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
    const full = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
    const busy = [true, true, true, false, true, true, false];
    const days = dows.map((dow, i) => {
      const on = this.state.day === i;
      return {
        dow, num: String(5 + i).padStart(2, '0'), on: on ? 'true' : 'false',
        style: 'height: 68px; padding: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; ' + (on ? 'border: 1px solid #2F6BFF; background: #2F6BFF; color: #FFFFFF;' : 'border: 1px solid #DCE6FA; background: #FFFFFF; color: #0F2D6B;'),
        dot: 'width: 5px; height: 5px; border-radius: 9999px; background: ' + (busy[i] ? (on ? '#FFFFFF' : '#2F6BFF') : 'transparent') + ';',
        pick: () => this.setState({ day: i })
      };
    });
    const looks = {
      free: 'flex-grow: 1; padding: 10px 14px; border-radius: 16px; border: 1.5px dashed #9DBBFF; background: #FFFFFF; color: #2F6BFF; display: flex; flex-direction: column; gap: 2px;',
      booked: 'flex-grow: 1; padding: 10px 14px; border-radius: 16px; background: #2F6BFF; color: #FFFFFF; display: flex; flex-direction: column; gap: 2px;',
      pending: 'flex-grow: 1; padding: 10px 14px; border-radius: 16px; background: #FEF3C7; color: #8A3F06; display: flex; flex-direction: column; gap: 2px;'
    };
    const raw = this.state.day === 1 ? [
      ['08:00', 'free', 'Giờ rảnh', '08:00 – 09:00 · Lịch lặp hàng tuần'],
      ['09:30', 'booked', 'Minh Đức · Review CV 1:1', '09:30 – 10:15 · Google Meet'],
      ['14:00', 'free', 'Giờ rảnh', '14:00 – 16:00'],
      ['19:00', 'pending', 'Thu Hà · Đang chờ xác nhận', '19:00 – 19:45 · Review CV 1:1']
    ] : (busy[this.state.day] ? [
      ['08:00', 'pending', 'Ngọc Anh · Đang chờ xác nhận', '08:00 – 08:45 · Review CV 1:1'],
      ['19:00', 'free', 'Giờ rảnh', '19:00 – 21:00 · Lịch lặp hàng tuần'],
      ['20:30', 'booked', 'Quang Huy · Mock interview PM', '20:30 – 21:30 · Google Meet']
    ] : []);
    const slots = raw.map(([start, k, title, sub]) => ({ start, title, sub, box: looks[k] }));
    if (!slots.length) slots.push({ start: '', title: 'Chưa có giờ rảnh', sub: 'Bấm “Thêm giờ rảnh” để mentee đặt lịch', box: looks.free });
    return { days, slots, dayTitle: full[this.state.day] + ', ' + (5 + this.state.day) + '/10' };
  }
}
</script>
</body>
</html>
