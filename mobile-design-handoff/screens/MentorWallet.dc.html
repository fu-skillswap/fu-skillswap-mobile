<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F7FD; font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; color: #0F2D6B">

      <div style="position: absolute; width: 170px; height: 170px; border-radius: 9999px; right: -50px; top: -60px; background: #1E3F85"></div>
      <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #56D1FF">SỐ DƯ KHẢ DỤNG</span>
        <span style="font-size: 32px; font-weight: 800; color: #FFFFFF">2.350.000</span>
        <span style="font-size: 13px; color: #B8C7E6">Đang tạm giữ 400.000 · chờ hoàn thành buổi học</span>
      </div>
      <div style="position: relative; display: flex; gap: 10px">
        <a href="#" style="flex-grow: 1; height: 48px; border-radius: 9999px; background: #FFFFFF; color: #0F2D6B; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V3M6 11l6 6 6-6M19 21H5"/></svg>Rút tiền</a>
        <a href="#" aria-label="Làm mới số dư" style="width: 48px; height: 48px; border-radius: 9999px; background: #1E3F85; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M3 21v-5h5M21 3v5h-5"/></svg></a>
      </div>
    </section>

    <a href="#" style="border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE6FA; padding: 12px 14px; display: flex; align-items: center; gap: 12px; color: #0F2D6B">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #EBF3FF; color: #2F6BFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #5A6A8C">Tài khoản nhận tiền</span><span style="font-size: 14px; font-weight: 700">[NGÂN HÀNG] •••• [4 SỐ CUỐI]</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 9999px; background: #EBF3FF">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="border-radius: 24px; background: #FFFFFF; border: 1px solid #DCE6FA; overflow: hidden; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="{{r.row}}">
          <span style="{{r.icon}}">{{r.sign}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{r.title}}</span><span style="font-size: 12px; color: #5A6A8C">{{r.sub}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="{{r.amtStyle}}">{{r.amt}}</span><span style="font-size: 11px; color: #5A6A8C">{{r.when}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Điều hướng mentor" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #DCE6FA; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="MentorDashboard.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Tổng quan</span></a>
    <a href="MentorBookings.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/></svg><span>Booking</span></a>
    <a href="MentorSchedule.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Lịch dạy</span></a>
    <a href="MentorWallet.dc.html" aria-current="page" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #2F6BFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span>Ví</span></a>
    <a href="MentorMore.dc.html" style="width: 68px; min-height: 48px; padding-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5A6A8C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Thêm</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'tx' }; }
  renderVals() {
    const cur = this.state.tab;
    const tabs = [['tx', 'Giao dịch gần đây'], ['payout', 'Yêu cầu rút']].map(([v, l]) => {
      const on = v === cur;
      return {
        label: l, on: on ? 'true' : 'false',
        style: 'height: 40px; border: 0; border-radius: 9999px; font-size: 13px; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #2F6BFF; font-weight: 700; box-shadow: 0 2px 8px rgba(15,45,107,0.08);' : 'background: transparent; color: #3D4F75; font-weight: 600;'),
        pick: () => this.setState({ tab: v })
      };
    });
    const tones = { in: ['#DCFCE7', '#15803D'], out: ['#EEF2FA', '#3D4F75'], hold: ['#FEF3C7', '#B45309'] };
    const tx = [
      ['in', 'Ghi nhận thu nhập', 'Review CV 1:1 · Minh Đức', '+ 150.000', '26/09'],
      ['hold', 'Tạm giữ', 'Mock interview PM · Quang Huy', '250.000', 'Hôm nay'],
      ['out', 'Phí nền tảng', 'Review CV 1:1 · Minh Đức', '− [PHÍ]', '26/09'],
      ['out', 'Đã rút', 'Về tài khoản ngân hàng', '− 1.000.000', '20/09']
    ];
    const payout = [
      ['hold', 'Chờ duyệt', 'Yêu cầu #RS-0192', '500.000', 'Hôm nay'],
      ['in', 'Đã chuyển', 'Yêu cầu #RS-0178', '1.000.000', '20/09']
    ];
    const src = cur === 'tx' ? tx : payout;
    const rows = src.map(([k, title, sub, amt, when], i) => ({
      title, sub, amt, when,
      sign: k === 'in' ? '+' : (k === 'hold' ? '•' : '−'),
      row: 'display: flex; align-items: center; gap: 12px; padding: 14px 16px;' + (i ? ' border-top: 1px solid #DCE6FA;' : ''),
      icon: 'flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; background: ' + tones[k][0] + '; color: ' + tones[k][1] + ';',
      amtStyle: 'font-size: 14px; font-weight: 800; color: ' + (k === 'in' ? '#15803D' : '#0F2D6B') + ';'
    }));
    return { tabs, rows };
  }
}
</script>
</body>
</html>
